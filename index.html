
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVY - Una aventura de cuatro recuerdos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="game-container">
        <header id="game-header">
            <div>
                <h1>IVY</h1>
                <p>Una aventura de cuatro recuerdos</p>
            </div>
            <div id="year">PREPARATORIA · 2022</div>
        </header>

        <section id="screen-container">
            <canvas id="game" width="960" height="640"></canvas>

            <div id="controls-help">
                <span>↑ ↓ ← →</span> o <span>W A S D</span> para caminar
                <span class="separator">|</span>
                <span>ENTER</span> para interactuar
            </div>
        </section>

        <footer id="game-footer">
            <span id="location-name">ACCESO SUR</span>
            <span>IVY ADVENTURE · LEVEL 1</span>
        </footer>
    </main>
<script src="map-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
